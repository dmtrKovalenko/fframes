[package]
name = "vs-remotion-bench"
version = "1.4.0"
edition = "2024"
publish = false

[dependencies]
fframes = { workspace = true, features = ["compile-time-svgtree"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
fframes = { workspace = true, features = ["h264", "libav-agree-gpl"] }

[target.'cfg(target_os = "macos")'.dependencies]
fframes = { workspace = true, features = ["videotoolbox"] }
fframes_skia_renderer = { workspace = true, features = ["metal"] }

# Match the supported Linux/Windows Skia binary-cache feature set.
[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }
ash = "0.38"

[lints]
workspace = true
