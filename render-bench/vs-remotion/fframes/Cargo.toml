[package]
name = "vs-remotion-bench"
description = "1M text nodes: the fframes side of the Remotion vs fframes benchmark"
version = "0.0.0"
edition = "2024"
publish = false

# Same feature set as examples/beta so the existing Skia (vulkan + metal) and FFmpeg
# builds in the workspace target dir are reused.
[dependencies]
fframes = { workspace = true, features = ["h264", "libav-agree-gpl", "compile-time-svgtree", "cli"] }
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }
fframes_native_player.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fframes_native_player = { workspace = true, features = ["metal"] }
