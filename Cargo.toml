[workspace]
resolver = "2"
members = [
    "e2e",
    "svgr-macro",
    "webvtt-parser",
    "fframes",
    "fframes-renderer",
    "fframes-editor-controller",
    "fframes-test-utils",
    "fframes-media-loaders",
    "fframes-skia-renderer",
    "media-dir-macro",
    # Examples 
    "examples/podcast",
    "examples/podcast/editor/editor-bridge",
    "examples/audio-announce",
    "examples/audio-announce/editor/editor-bridge",
    "examples/hello-world",
    "examples/hello-world/editor/editor-bridge",
    "examples/marketing",
    "examples/marketing/editor/editor-bridge",
    "examples/tiktok",
    "examples/tiktok/media",
    "examples/tiktok/editor/editor-bridge",
    "examples/marketing/editor/editor-bridge",
    "examples/low-poly-art",
    "examples/low-poly-art/editor/editor-bridge",
    "examples/beta",
    "examples/beta/editor/editor-bridge",
    "examples/conference-splash-screen",
    "examples/conference-splash-screen/editor/editor-bridge",
    "examples/teej-podcast",
    "examples/teej-podcast/editor/editor-bridge",
    "examples/pixel-memory",
    "examples/pixel-memory/editor/editor-bridge",

    # maybe clean this up?
    # "fframes-lyon-renderer",
]

[workspace.dependencies]
# If you are working locally on renderer, just clone https://github.com/dmtrKovalenko/svgr 
# into the parent directory of fframes (as a sibling) and uncomment the following lines:
# svgr = { path = "../svgr/crates/svgr" }
# usvgr = { path = "../svgr/crates/usvgr" }
svgr = "0.43.4"
usvgr = "0.43.4"
ffmpeg-sys-fframes = { package = "ffmpeg-sys-fframes", version = "7.1.1", features = [
    "build",
    "static",
] }
wasm-bindgen = "0.2.100"

# fframes internal deps 
fframes_renderer = { path = "fframes-renderer", version = "1.0.0-beta.6.rc-3.2" }
fframes-media-loaders = { path = "fframes-media-loaders", version = "1.0.0-beta.6.rc-3.2" }
svgr-macro = { path = "svgr-macro", version = "1.0.0-beta.6.rc-3.2" }
fframes-media-dir-macro = { path = "media-dir-macro", version = "1.0.0-beta.6.rc-3.2" }
fframes = { path = "fframes", version = "1.0.0-beta.6.rc-3.2" }
webvtt-parser = { path = "webvtt-parser", version = "1.0.0-beta.6.rc-3.2" }
fframes_skia_renderer = { path = "fframes-skia-renderer", version = "1.0.0-beta.6.rc-3.2" }
