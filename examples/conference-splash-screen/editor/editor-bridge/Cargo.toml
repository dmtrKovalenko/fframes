[package]
name = "conference-splash-screen-bridge-example"
version = "1.0.0-beta.6.rc-2.1"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
edition = "2018"

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
