[package]
name = "assembly-example"
version = "1.2.0"
edition = "2024"
publish = false

[dependencies]
fframes.workspace = true
fframes-3d.workspace = true

# Skia on Metal on macOS, on Vulkan everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { workspace = true, features = ["h264", "libav-agree-gpl"] }

# Keep FFmpeg source fallbacks portable across CI runner CPUs (see README).
[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
fframes = { workspace = true, features = ["build-portable"] }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree", "fframes/cli"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "assembly_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "assembly"
path = "src/main.rs"
required-features = ["renderer"]

[[bin]]
name = "assembly-soundtrack"
path = "src/bin/soundtrack.rs"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
