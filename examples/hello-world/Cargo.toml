[package]
name = "hello-world-example"
version = "1.0.0-beta.6.rc-3.2"
edition = "2024"

[dependencies]
fframes = { workspace = true, features = ["h264", "h265", "libav-agree-gpl"] }
clap = { version = "4.3.4", features = ["derive"] }
image = "0.25.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer = { workspace = true }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "hello_world_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hello_world_example_bin"
path = "src/main.rs"
required-features = ["renderer"]
