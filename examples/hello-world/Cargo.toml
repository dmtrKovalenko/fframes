[package]
name = "hello-world-example"
version = "1.0.3"
edition = "2024"

[dependencies]
fframes = { workspace = true, features = ["h264", "h265", "vpx", "libav-agree-gpl"] }

clap = { version = "4.3.4", features = ["derive"] }

# Keep FFmpeg source fallbacks portable across CI runner CPUs (see README).
[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
fframes = { workspace = true, features = ["build-portable"] }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree", "fframes/cli"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "hello_world_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hello_world_example_bin"
path = "src/main.rs"
required-features = ["renderer"]

[lints]
workspace = true
