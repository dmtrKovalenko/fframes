[package]
name = "hello-word-bridge-example"
version = "1.3.0"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
edition = "2024"

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "./lib.rs"
name = "hello_world_bridge_example"

[dependencies]
wasm-bindgen = "0.2.100"
fframes-editor-controller = { path = "../../../../fframes-editor-controller" }
hello-world-example = { path = "../../", default-features = false }
once_cell = "1.21.1"

[lints]
workspace = true
