[package]
name = "thanos-prs"
version = "1.4.1"
edition = "2024"
publish = false

[dependencies]
fframes = { workspace = true, features = ["cli", "compile-time-svgtree", "h264", "libav-agree-gpl", "build-portable"] }
fframes_skia_renderer = { workspace = true, features = ["cli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["metal"] }
fframes_native_player = { workspace = true, features = ["metal", "audio"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }
fframes_native_player = { workspace = true, features = ["vulkan", "audio"] }

[lints]
workspace = true
