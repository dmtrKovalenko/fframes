[package]
name = "teej_podcast_example"
version = "1.0.0-beta.6.rc-3.2"
edition = "2024"

[dependencies]
clap = { version = "4.3.4", features = ["derive"] }
fframes = { workspace = true, features = ["h264", "h265", "libav-agree-gpl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree"]

[lib]
name = "teej_podcast_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "teej_podcast_example_bin"
path = "src/main.rs"
required-features = ["renderer"]
