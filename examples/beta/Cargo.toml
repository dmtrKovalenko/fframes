[package]
name = "beta-example"
version = "0.1.0"
edition = "2021"

[dependencies]
svgr-macro = { path="../../svgr-macro" }
fframes = {path="../../fframes"}
lazy_static = "1.4.0"
libm="0.2.1"
rand="0.8.5"
getrandom = { version = "0.2", features = ["js"] }
hello-world-example ={path="../hello-world", default-features=false}
marketing-example ={path="../marketing", default-features=false}
podcast-example ={path="../podcast", default-features=false}
tiktok-example ={path="../tiktok", default-features=false}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer ={path="../../fframes-renderer"}

[features]
default=["renderer"]
renderer=["fframes/compile-time-svgtree", "hello-world-example/renderer", "marketing-example/renderer", "podcast-example/renderer", "tiktok-example/renderer"]

[lib]
name = "beta_example"
path = "src/lib.rs"

[[bin]]
name = "beta_example_bin"
path = "src/main.rs"
required-features=["renderer"]