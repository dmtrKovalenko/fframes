[package]
name = "podcast-example"
version = "1.0.0-beta.6.rc-2.1"
edition = "2021"

[dependencies]
fframes.workspace = true
libm = "0.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer.workspace = true

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree"]

[lib]
name = "podcast_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "podcast_example_bin"
path = "src/main.rs"
required-features = ["renderer"]
