[package]
name = "podcast-example"
version = "1.0.0-beta.4"
edition = "2021"

[dependencies]
fframes = {path="../../fframes"}
libm = "0.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer ={path="../../fframes-renderer"}

[features]
default=["renderer"]
renderer=["fframes/compile-time-svgtree"]

[lib]
name = "podcast_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "podcast_example_bin"
path = "src/main.rs"
required-features=["renderer"]
