[package]
name = "podcast-example"
version = "1.0.0-beta.6.rc-3.2"
edition = "2024"

[dependencies]
fframes.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer = { workspace = true, features = ["h264", "libav-agree-gpl"] }
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree"]

[lib]
name = "podcast_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "podcast_example_bin"
path = "src/main.rs"
required-features = ["renderer"]
