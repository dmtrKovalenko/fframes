[package]
name = "low-poly-art-example"
version = "1.0.0-beta.6.rc-3.2"
edition = "2024"

[dependencies]
libm = "0.2.1"
rand = "0.8.5"
fframes = { workspace = true }

[dev-dependencies]
fframes_test_utils = { path = "../../fframes-test-utils" }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree"]

[lib]
name = "low_poly_art_example"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "low_poly_art_example_bin"
path = "src/main.rs"
required-features = ["renderer"]
