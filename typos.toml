[files]
# Keep the upstream minified player unchanged; its identifiers are not prose.
extend-exclude = ["*.snapshot.txt", "sessions.json", "examples/the-why/landing/vendor/hls.min.js", "landing/vendor/hls.min.js"]
[default.extend-words]
hd = "hd"
# "PNGs" is split into "PN" + "Gs"
PN = "PN"
# graphics terms of fframes-3d: PBR metalness (three.js), level of detail, integer y next to ix
metalness = "metalness"
lod = "lod"
iy = "iy"
