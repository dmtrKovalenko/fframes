name: Landing
on:
  push:
    branches: [ main ]
    paths: [ "landing/**", ".github/workflows/landing.yml" ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    paths: [ "landing/**", ".github/workflows/landing.yml" ]
  workflow_dispatch:

# Deploys never overlap, the newest push wins
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# The site is plain files: wrangler uploads landing/ as static assets, nothing is installed or built
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: npx --yes wrangler@4 deploy

  # One Preview per pull request (pr-<number>), its URL is commented on the PR
  preview:
    name: Preview on Cloudflare
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Forks get no secrets, they only check that the files deploy
      - name: Check
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Create or update Preview
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -o pipefail
          output="$(npx --yes wrangler@4 preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        if: steps.preview.outputs.url
        run: gh pr comment "$PR" --edit-last --create-if-none --body "Landing preview → $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}

  preview-cleanup:
    name: Delete Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete Preview
        run: npx --yes wrangler@4 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
