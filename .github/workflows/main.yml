name: Build

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/checkout@v2
      - uses: extractions/setup-just@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy

      - uses: Iamshankhadeep/setup-ffmpeg@v1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # - run: sudo apt-get install libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev libswscale-dev libavdevice-dev
      - run: brew install ffmpeg

      - name: Build
        run: just build

      - name: Clippy
        run: just clippy

      # We have to use the Release mode, otherwise it would take forever.
      - name: Test
        run: cargo test

      - name: Upload visual regression results and diff
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: results
          if-no-files-found: error
          path: |
            e2e/frames/results
            e2e/frames/diff
            e2e/out.mp4
