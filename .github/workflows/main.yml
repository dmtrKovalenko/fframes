name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Spellcheck
        uses: crate-ci/typos@master
        with:
          config: ./typos.toml

  build:
    name: Build and Test
    continue-on-error: true
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: extractions/setup-just@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apt-deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ffmpeg libx264-dev libx265-dev libmp3lame-dev libopus-dev 

      - name: Install brew deps 
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ffmpeg x264 x265 lame opus nasm
          brew link x264 x265 lame --force

      - name: Install yarn
        run: |-
          curl -fsSL --create-dirs -o $HOME/.local/bin/yarn \
          https://github.com/yarnpkg/yarn/releases/download/v1.22.19/yarn-1.22.19.js
          chmod +x $HOME/.local/bin/yarn
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install frontend deps
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile --prefer-offline

      - name: Syncpack
        run: just syncpack

      - name: Build
        run: just build

      - name: Check format
        run: cargo fmt --check

      - name: Check examples wasm build
        run: |
          rustup target add wasm32-unknown-unknown
          just check-examples

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test

      - name: Upload visual regression results and diff
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: results
          if-no-files-found: ignore
          path: |
            e2e/frames/results
            e2e/frames/diff
            e2e/out.mp4
            */**/_svgr_snapshots/*
