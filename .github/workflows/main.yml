name: CI
on:
  push:
    branches: [ main ]
    # A v1.2.3 tag from scripts/release.sh publishes that version, see the publish job
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  # GitHub evicts caches that were not used for 7 days, rebuild them before that
  # happens so the first PR after a quiet week does not rebuild Skia and FFmpeg.
  schedule:
    - cron: "0 5 * * 1,4"

# A new push to a PR supersedes its running build. Other runs get a unique group:
# a shared one would drop queued main runs (and their nightly release).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Spellcheck
        uses: crate-ci/typos@master
        with:
          config: ./typos.toml

  build-rescript:
    name: Build ReScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile --prefer-offline

      # - name: Syncpack
      #   working-directory: fframes-editor
      #   run: pnpm syncpack lint
 
      - name: Build frontend
        working-directory: fframes-editor
        run: pnpm build

  build-rust:
    name: Build and Test
    continue-on-error: true
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    env:
      DEBIAN_FRONTEND: noninteractive
      # Skia and FFmpeg are built from source and every example is compiled
      # twice (check + test); debuginfo and incremental artifacts alone push
      # the target dir past the runner's disk.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: extractions/setup-just@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apt-deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16 llvm ninja-build libgl1 libgl1-mesa-dev libgles2-mesa-dev libssl-dev libfontconfig1-dev mesa-common-dev libwayland-dev yasm nasm ffmpeg libx264-dev libx265-dev libopus-dev libvpx-dev libasound2-dev

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
         vulkan-query-version: 1.3.204.0
         vulkan-components: Vulkan-Headers, Vulkan-Loader
         vulkan-use-cache: true

      - name: Install brew deps 
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ffmpeg x264 x265 opus nasm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          always-auth: true
          node-version: 23
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: 
          cache: true
          cache-on-failure: true
          cache-key: "v3-rust"
          # PR scoped caches are only visible to that PR and push main's cache out
          # of the 10GB quota, so only main saves. PRs restore main's cache.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          components: rustfmt, clippy

      - name: Check format
        run: cargo fmt --check

      - name: Build
        run: just clippy

      - name: Test
        run: just test

      - name: Disk usage
        if: always()
        run: df -h /

      - name: Upload visual regression results and diff
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results
          if-no-files-found: ignore
          path: |
            e2e/frames/results
            e2e/frames/diff
            e2e/out.mp4
            */**/_svgr_snapshots/*

  # Runs in parallel with `build-rust`: it needs no Skia, only FFmpeg for the
  # `include_media_dir!` proc-macro on the host.
  check-wasm:
    name: Check examples wasm build
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: extractions/setup-just@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apt-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm yasm nasm libx264-dev libx265-dev libopus-dev libvpx-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-on-failure: true
          cache-key: "v3-rust-wasm"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: wasm32-unknown-unknown

      - name: Check examples wasm build
        run: just check-examples

  release:
    # A push to main publishes a nightly, a v* tag publishes that version (scripts/release-version.sh)
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # npm trusted publishing: the job proves its identity to npm with an OIDC token instead of a secret
    permissions:
      contents: write # the GitHub release of a tag
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5+, the first npm that can publish through trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-key: "v3-rust"

      - name: Publish crates and @fframes/editor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git fetch --tags --force
          scripts/publish.sh "$(scripts/release-version.sh)"

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  build-windows:
    name: Windows build and render test
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Windows links a prebuilt FFmpeg instead of compiling it (see README). The
      # codec features of the examples request a from-source build, so only the
      # core crates are built here.
      FFMPEG_BUILD: ffmpeg-n9.0-latest-win64-gpl-shared-9.0
      PACKAGES: -p fframes -p fframes-media -p webvtt-parser -p fframes-media-dir-macro -p svgr-macro -p e2e-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg 9
        run: |
          TMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL -o "$TMP_DIR/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG_BUILD.zip"
          7z x "$TMP_DIR/ffmpeg.zip" -o"$TMP_DIR" > /dev/null
          FFMPEG_DIR="$(cygpath -w "$TMP_DIR/$FFMPEG_BUILD")"
          echo "FFMPEG_DIR=$FFMPEG_DIR" >> "$GITHUB_ENV"
          # DLLs are loaded by the tests and by proc macros during compilation
          echo "$FFMPEG_DIR\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-on-failure: true
          cache-key: "v1-rust-windows"
          components: clippy

      - name: Clippy
        run: |
          cargo clippy $PACKAGES --tests -- -D warnings -A clippy::option-map-unit-fn \
            -A clippy::module_inception -A clippy::single-match -A clippy::single-range-in-vec-init

      - name: Unit tests
        run: cargo test -p fframes -p fframes-media -p webvtt-parser -p fframes-media-dir-macro

      - name: Render a video
        run: cargo test -p e2e-tests --test render_smoke -- --nocapture
