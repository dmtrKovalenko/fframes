name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Spellcheck
        uses: crate-ci/typos@master
        with:
          config: ./typos.toml

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    container: jrottenberg/ffmpeg:7-ubuntu
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: extractions/setup-just@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: apt update
      - run: apt install -y build-essential lsb-release wget curl software-properties-common gnupg pkg-config
      - run: bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"

      - name: Install yarn
        run: |-
          curl -fsSL --create-dirs -o $HOME/bin/yarn \
          https://github.com/yarnpkg/yarn/releases/download/v1.22.19/yarn-1.22.19.js
          chmod +x $HOME/bin/yarn
          echo "$HOME/bin" >> $GITHUB_PATH

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"
          cache-on-failure: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install frontend deps
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile --prefer-offline

      - name: Syncpack
        run: just syncpack

      - name: Build
        run: just build

      - name: Check format
        run: cargo fmt --check

      - name: Check examples wasm build
        run: |
          rustup target add wasm32-unknown-unknown
          just check-examples

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test

      - name: Upload visual regression results and diff
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: results
          if-no-files-found: ignore
          path: |
            e2e/frames/results
            e2e/frames/diff
            e2e/out.mp4
            */**/_svgr_snapshots/*
