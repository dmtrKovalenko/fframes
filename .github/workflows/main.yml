name: Build

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/checkout@v2
      - uses: extractions/setup-just@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly

      # TODO CACHE
      # run: just install-ffmpeg 4.4.2
      - run: sudo apt-get install libav-tools libavformat-dev libavcodec-dev
      - run: ffmpeg -version

      - name: Build
        run: just build

      - name: Clippy
        run: just clippy

      # We have to use the Release mode, otherwise it would take forever.
      - name: Test
        run: cargo test --release
