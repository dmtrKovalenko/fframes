[package]
version = "0.1.1"
name = "svgr-macro"
edition = "2018"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "1", features = ["full", "parsing", "extra-traits"] }
uuid = { version = "0.8", features = ["v4"] }
usvg = "0.23.0"
[dev-dependencies]
criterion = "0.3"
