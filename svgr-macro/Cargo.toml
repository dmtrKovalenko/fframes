[package]
version = "1.0.0-beta.6.rc-3.2"
name = "svgr-macro"
edition = "2018"
description = "A macro for generating SVG trees at compile time"
license = "MIT"
homepage = "https://fframes.studio"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1.0.38"
syn = { version = "2.0.98", features = ["full", "parsing", "extra-traits"] }
usvgr = { workspace = true, features = ["proc-macro"] }
proc-macro-crate = "3.2.0"
lazy_static = "1.4.0"
rust-fuzzy-search = "0.1.0"

[features]
compile-time-svgtree = []
