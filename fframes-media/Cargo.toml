[package]
name = "fframes-media"
version = "1.0.3"
description = "Media loaders used by different fframes packages. This crate is not meant to be used directly."
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
edition = "2024"
license = "MIT"
homepage = "https://fframes.studio"
exclude = ["test_audio/*"]

[lib]

[dependencies]
quote = { version = "1.0.9", optional = true }
webvtt-parser.workspace = true
bytemuck = { version = "1.13.1", features = ["derive"] }
ttf-parser = "0.25.1"
itoa = "1.0.14"
kamadak-exif = { workspace = true, optional = true }
base64 = { version = "0.22.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ffmpeg-sys-fframes.workspace = true
image = { version = "0.25.6", default-features = false, features = [
  "png",
  "jpeg",
] }
usvgr.workspace = true
libc = "0.2.159"

# FFmpeg is linked statically everywhere except Windows. ffmpeg-sys-fframes downloads a
# prebuilt static FFmpeg for the target and codec features from its GitHub releases and
# compiles it from source only when there is none (FFMPEG_FORCE_BUILD=1 forces that). On
# Windows building it needs an MSYS2 + MSVC toolchain, so there it is linked from a prebuilt
# FFmpeg 9 distribution found through FFMPEG_DIR or vcpkg (see README).
#
# `fframes_docsrs` is set by the docs.rs build (see [package.metadata.docs.rs] below). docs.rs has no
# network access, so the from-source build is skipped there and ffmpeg-sys-fframes falls back to
# the FFmpeg headers of the docs.rs image through pkg-config. It is a project cfg on purpose:
# `--cfg docsrs` in RUSTFLAGS would also reach every dependency, and some enable removed
# nightly features under it.
[target.'cfg(not(any(target_arch = "wasm32", windows, fframes_docsrs)))'.dependencies]
ffmpeg-sys-fframes = { workspace = true, features = ["build", "static"] }

[features]
# by default we enable only platform specific encoders that 
# would be always populated by the platform sysroot itself
default = []
# Preserve prebuilt downloads and omit host CPU flags when building from source.
build-portable = ["ffmpeg-sys-fframes/build-portable"]
# enable various encoder & decoders libraries
h264 = ["ffmpeg-sys-fframes/build-lib-x264"]
h265 = ["ffmpeg-sys-fframes/build-lib-x265"]
aac = ["ffmpeg-sys-fframes/build-lib-aacplus"]
mp3lame = ["ffmpeg-sys-fframes/build-lib-mp3lame"]
opus = ["ffmpeg-sys-fframes/build-lib-opus"]
vpx = ["ffmpeg-sys-fframes/build-lib-vpx"]
# enable various hardware accelerations
videotoolbox = ["ffmpeg-sys-fframes/build-videotoolbox"]
audiotoolbox = ["ffmpeg-sys-fframes/build-audiotoolbox"]
vaapi = ["ffmpeg-sys-fframes/build-vaapi"]
nvidia = ["ffmpeg-sys-fframes/build-nvidia"]
qsv = ["ffmpeg-sys-fframes/build-lib-libmfx"]
vulkan = ["ffmpeg-sys-fframes/build-vulkan"]
mediacodec = ["ffmpeg-sys-fframes/build-mediacodec"]
direct3d11 = ["ffmpeg-sys-fframes/build-lib-d3d11va"]
direct3d9 = ["ffmpeg-sys-fframes/build-lib-dxva2"]
exif = ["kamadak-exif"]

# licensing stuff
libav-agree-gpl = ["ffmpeg-sys-fframes/build-license-gpl"]
libav-agree-nonfree = ["ffmpeg-sys-fframes/build-license-nonfree"]
libav-agree-version3 = ["ffmpeg-sys-fframes/build-license-version3"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "fframes_docsrs"]

[lints]
workspace = true
