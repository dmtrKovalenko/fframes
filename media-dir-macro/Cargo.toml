[package]
name = "fframes-media-dir-macro"
version = "1.0.0-beta.6.rc-3.2"
edition = "2024"
description = "A macro for generating SVG trees at compile time"
license = "MIT"
homepage = "https://fframes.studio"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.2.0"
proc-macro2 = "1"
quote = "1.0.38"
syn = { version = "2.0.98", features = [
  "full",
  "parsing",
  "extra-traits",
  "proc-macro",
] }
bytemuck = "1.21.0"
base64 = "0.22.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes-media-loaders.workspace = true

# this is acutally just suppresssing the error message at compile time
[target.'cfg(target_os = "macos")'.dependencies]
fframes-media-loaders = { workspace = true, features = ["videotoolbox"] }

[features]
nightly = []
metadata = []
