[package]
name = "fframes_skia_renderer"
description = "Rendering backend for fframes using skia"
version = "1.3.0"
edition = "2024"
license = "MIT"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]

[lib]
doctest = false
[dependencies]
# Upstream rust-skia publishes prebuilt Skia binaries (downloaded by its build script) for a
# fixed set of feature combinations. The features below are chosen to match one of them for
# every GPU backend, otherwise Skia is compiled from source (~20 minutes, needs libclang):
#   macOS metal:             ganesh, gl, metal, svg, textlayout
#   macOS vulkan (MoltenVK): ganesh, gl, svg, textlayout, vulkan
#   Linux/Windows vulkan:    ganesh, svg, textlayout, vulkan, webp
# See https://github.com/rust-skia/skia-binaries/releases for the available keys.
skia-safe = { version = "0.153.3", features = ["svg"] }
thingbuf = "0.1.6"
fframes.workspace = true
ash = { version = "0.38.0", optional = true }
metal-rs = { package = "metal", version = "0.32.0", optional = true }
uuid = "1.12.1"
foreign-types-shared = "0.3.1"
# `vulkan-portability`: the Vulkan backend on macOS too (MoltenVK), where `vulkan` alone has none
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "vulkan-portability", "metal", "dx12"] }

# Cargo merges these features into the skia-safe dependency above.
[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.153.3", features = ["svg", "gl"] }
# CoreVideo attributes of the VideoToolbox frames rendered with Metal
core-foundation = { version = "0.10", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
skia-safe = { version = "0.153.3", features = ["svg", "webp"] }

[dev-dependencies]
# `3d`: `tests/wgpu_layers.rs` draws a 3D frame through the shared GPU
fframes = { workspace = true, features = ["compile-time-svgtree", "3d"] }
png = "0.17"
svgr.workspace = true
low-poly-art-example = { path = "../examples/low-poly-art" }

[features]
default = ["gpu", "binary-cache"]
binary-cache = ["skia-safe/binary-cache"]
gpu = ["skia-safe/ganesh"]
metal = ["gpu", "skia-safe/metal", "metal-rs", "dep:core-foundation"]
vulkan = ["gpu", "skia-safe/vulkan", "ash"]
# Share the Vulkan device with FFmpeg, so Vulkan Video encoders (h264_vulkan, hevc_vulkan)
# read the frames on the GPU. Builds FFmpeg with Vulkan support.
vulkan-video = ["vulkan", "fframes/vulkan"]
# `--renderer skia-cpu|gpu` for `fframes::cli`, see `cli::SkiaRenderers`
cli = ["fframes/cli"]
# Open the Vulkan device as a wgpu device as well (`fframes::shared_gpu`): textures rendered
# with wgpu (`fframes::three_d`) are drawn into the frames on the GPU, without a readback.
wgpu = ["vulkan", "fframes/wgpu", "dep:wgpu"]
d3d = ["skia-safe/d3d"]
gl = ["skia-safe/gl"]
x11 = ["skia-safe/x11"]
wayland = ["skia-safe/wayland"]
egl = ["skia-safe/egl"]
# activate this feature to measure perforamnce and debug skia
debug = []

# See fframes-media/Cargo.toml: docs.rs cannot build FFmpeg from source.
[package.metadata.docs.rs]
rustc-args = ["--cfg", "fframes_docsrs"]

[lints]
workspace = true
