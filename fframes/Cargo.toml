[package]
name = "fframes"
version = "1.0.1"
edition = "2024"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
license = "MIT"
description = "A video generation framework"
homepage = "https://fframes.studio"
build = "build.rs"

[[bench]]
name = "yuv420_conversion"
harness = false

[lib]
doctest = false

[dependencies]
microfft = "0.6.0"
libm = "0.2.1"
lazy_static = "1.4.0"
num = "0.4.1"
konst = "0.3.16"
rangemap = "1.0.3"
ttf-parser = "0.25.1"
lru = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12.1"
log = "0.4"

# fframes dependencies
usvgr.workspace = true
svgr-macro.workspace = true
fframes-media.workspace = true
fframes-media-dir-macro.workspace = true
kamadak-exif.workspace = true

# these are renderer/encoder specific dependnecies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
svgr = { workspace = true, optional = true }
rayon = "1.5.1"
colored = "2"
futures = "0.3.24"
image = "0.25.0"
memmap = "0.7.0"
indicatif = "0.18"
once_cell = "1.10.0"
uuid = { version = "1.8.0", features = ["v4"] }
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
approx = "0.5.0"
rand = "0.9.1"
criterion = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"

[features]
# by default we enable only platform specific encoders that 
# would be always populated by the platform sysroot itself
default = ["cpu_renderer"]
cpu_renderer = ["svgr"]
# `fframes::cli`: a ready made command line (render, frames, contact sheets, inspect, audio)
cli = ["cpu_renderer", "dep:clap", "dep:serde_json"]
exif = ["fframes-media/exif", "fframes-media-dir-macro/exif"]
compile-time-svgtree = ["svgr-macro/compile-time-svgtree"]

# enable various encoders & decoders
h264 = ["fframes-media/h264"]
h265 = ["fframes-media/h265"]
aac = ["fframes-media/aac"]
mp3lame = ["fframes-media/mp3lame"]
opus = ["fframes-media/opus"]
vpx = ["fframes-media/vpx"]
# enable various hardware accelerations
videotoolbox = ["fframes-media/videotoolbox"]
audiotoolbox = ["fframes-media/audiotoolbox"]
vaapi = ["fframes-media/vaapi"]
nvidia = ["fframes-media/nvidia"]
qsv = ["fframes-media/qsv"]
vulkan = ["fframes-media/vulkan"]
mediacodec = ["fframes-media/mediacodec"]
# might b required for some of the other features licensing
libav-agree-gpl = ["fframes-media/libav-agree-gpl"]
libav-agree-nonfree = ["fframes-media/libav-agree-nonfree"]
libav-agree-version3 = ["fframes-media/libav-agree-version3"]

[package.metadata.docs.rs]
# The codec and hardware features compile FFmpeg from source, which docs.rs cannot do (no
# network), so only the pure Rust features are documented. `--cfg fframes_docsrs` makes
# fframes-media link the FFmpeg headers of the docs.rs image instead of building FFmpeg.
features = ["cli", "compile-time-svgtree", "exif"]
rustc-args = ["--cfg", "fframes_docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
] }
