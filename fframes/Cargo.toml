[package]
name = "fframes"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
microfft = "0.4.0"
libm = "0.2.1"
lazy_static = "1.4.0"
num = "0.4.0"
webvtt-parser = {path="../webvtt-parser"}
svgr-macro={path="../svgr-macro"}
konst="0.2.15"
roxmltree="0.14.1"
rangemap="1.0.3"
futures="0.3.24"
ttf-parser="0.18.0"
lru="0.9.0"
serde = { version = "1.0", features = ["derive"] }
usvgr = { path = "../../resvg/usvgr" }

[lib]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.74"