[package]
name = "fframes_renderer"
version = "0.1.0"
edition = "2018"

[dependencies]
svgr = { workspace = true }
usvgr-text-layout = { workspace = true }
rayon = "1.5.1"
colored = "2"
indicatif = "0.16.2"
once_cell = "1.10.0"
lazy_static = "1.3.0"
lyon = "0.17.10"
wgpu = "0.12.0"
bytemuck = "1.15.0"
futures = "0.3.30"
image = "0.25.0"
ffmpeg-next = "6.1.1"
memmap = "0.7.0"

syn = { version = "1", features = ["full", "parsing", "extra-traits"] }
uuid = { version = "1.8.0", features = ["v4"] }
svgr-macro = { path = "../svgr-macro" }
fframes = { path = "../fframes" }

[build-dependencies]
cc = "1.0"
